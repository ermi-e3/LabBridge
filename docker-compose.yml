name: labbridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: labbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labbridge}
      POSTGRES_USER: ${POSTGRES_USER:-labbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labpassword}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
